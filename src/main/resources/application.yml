server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: mmvb-trading-bot-v2
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  task:
    scheduling:
      pool:
        size: 8
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading_bot}
    username: ${DB_USER:trader}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading_bot}
    username: ${DB_USER:trader}
    password: ${DB_PASS:}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Outbox transport (roadmap v2.3, раздел 13.8). Выключен по умолчанию:
# RabbitMQ не обязателен — inline-доставка + DB-worker (фолбэк) работают без него.
app:
  outbox:
    rabbitmq:
      enabled: ${OUTBOX_RABBITMQ_ENABLED:false}
      exchange: ${OUTBOX_RABBITMQ_EXCHANGE:trading.outbox}
      queue: ${OUTBOX_RABBITMQ_QUEUE:trading.outbox.orders}
      routing-key: ${OUTBOX_RABBITMQ_ROUTING_KEY:order}
      dlx: ${OUTBOX_RABBITMQ_DLX:trading.outbox.dlx}
      dlq: ${OUTBOX_RABBITMQ_DLQ:trading.outbox.orders.dlq}

alor:
  api-url: ${ALOR_API_URL:https://api.alor.ru}
  ws-url: ${ALOR_WS_URL:wss://api.alor.ru/ws}
  token: ${ALOR_TOKEN:}
  refresh-token: ${ALOR_REFRESH_TOKEN:}
  portfolio: ${ALOR_PORTFOLIO:D12345}
  exchange: ${ALOR_EXCHANGE:MOEX}
  retry-enabled: ${ALOR_RETRY_ENABLED:true}
  rate-limiter-enabled: ${ALOR_RATE_LIMITER_ENABLED:true}
  circuit-breaker-enabled: ${ALOR_CIRCUIT_BREAKER_ENABLED:true}
  max-order-retries: ${ALOR_MAX_ORDER_RETRIES:5}
  ws-reconcile-on-reconnect: ${ALOR_WS_RECONCILE_ON_RECONNECT:true}
  ws-heartbeat-interval-ms: ${ALOR_WS_HEARTBEAT_INTERVAL_MS:30000}
  ws-heartbeat-timeout-ms: ${ALOR_WS_HEARTBEAT_TIMEOUT_MS:45000}
  ws-stale-message-age-ms: ${ALOR_WS_STALE_MESSAGE_AGE_MS:5000}
  ws-orders-enabled: ${ALOR_WS_ORDERS_ENABLED:false}
  ws-order-timeout-ms: ${ALOR_WS_ORDERS_TIMEOUT_MS:10000}
  entry-partial-fill-cancel-after-ms: ${ALOR_ENTRY_PARTIAL_FILL_CANCEL_AFTER_MS:30000}
  outbox-backoff-base-seconds: ${ALOR_OUTBOX_BACKOFF_BASE_SECONDS:10}
  outbox-backoff-max-seconds: ${ALOR_OUTBOX_BACKOFF_MAX_SECONDS:120}

moex:
  base-url: https://iss.moex.com/iss

macro:
  cbr-rate: ${CBR_RATE:16.0}
  brent-price: ${BRENT_PRICE:75.0}
  usd-rub: ${USD_RUB:90.0}
  usd-rub-ticker: USD000UTSTOM
  snapshot-enabled: ${MACRO_SNAPSHOT_ENABLED:false}    # исторические снапшоты макро для ML-датасета (13.11.2)
  snapshot-interval-ms: ${MACRO_SNAPSHOT_INTERVAL_MS:900000}

llm:
  provider: ${LLM_PROVIDER:ROUTER_AI}
  api-key: ${LLM_API_KEY:}
  base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
  model: ${KIMI_MODEL:kimi-k3}
  router-ai-base-url: ${ROUTER_AI_BASE_URL:https://routerai.ru/api/v1}
  router-ai-model: ${ROUTER_AI_MODEL:auto}
  kimi-base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
  kimi-model: ${KIMI_MODEL:kimi-k3}
  deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  deepseek-model: ${DEEPSEEK_MODEL:deepseek-chat}
  qwen-base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  qwen-model: ${QWEN_MODEL:qwen-plus}
  timeout-sec: 30
  max-tokens: 4096
  temperature: 0.15
  semantic-cache-enabled: ${LLM_SEMANTIC_CACHE:true}
  semantic-cache-ttl-minutes: ${LLM_SEMANTIC_CACHE_TTL:30}
  guardrails-max-price-deviation-percent: 3.0
  circuit-breaker-enabled: true
  rate-limiter-enabled: true
  retry-enabled: true
  queue-capacity: 64
  queue-concurrency: 2
  delta-prompts-enabled: ${LLM_DELTA_PROMPTS_ENABLED:false}

trace-storage:
  enabled: ${TRACE_STORAGE_ENABLED:false}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:llm-traces}
  region: us-east-1
  async-buffer-size: ${TRACE_ASYNC_BUFFER_SIZE:1024}
  retention-days: ${TRACE_RETENTION_DAYS:0}

# Shadow Mode / Decision-level A/B (Phases 3). По умолчанию выключен —
# включается через BotSettings (UI/POST /api/v1/settings), см. SettingsService.
experiment:
  enabled: ${EXPERIMENT_ENABLED:false}
  experiment-id: ${EXPERIMENT_ID:default}
  variant-prompt-version: ${EXPERIMENT_VARIANT_PROMPT_VERSION:}
  shadow-execution: ${EXPERIMENT_SHADOW_EXECUTION:false}
  rollout-percent: ${EXPERIMENT_ROLLOUT_PERCENT:100}

# RAG-анализ ошибок LLM-агентов по трейсам из S3/MinIO (требует trace-storage.enabled=true).
rag:
  enabled: ${RAG_ENABLED:false}
  corpus-limit: ${RAG_CORPUS_LIMIT:500}
  refresh-interval-ms: ${RAG_REFRESH_INTERVAL_MS:600000}
  max-results: ${RAG_MAX_RESULTS:5}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.02}
  llm-enabled: ${RAG_LLM_ENABLED:true}

# ML-агенты (roadmap v2.4, раздел 13.11). ml.enabled — мастер-флаг модуля (промоушн
# после out-of-sample валидации); при false эндпоинты экспорта датасета недоступны.
# dataset.* — настройки экспорта обучающего датасета (positions + candles + agent_logs).
# model.* — путь к обученной модели CatBoost (инференс, раздел 13.11.4).
# screening.* — настройки ML-скрининга кандидатов (раздел 13.11.4).
# filter.* — ML-фильтр входа в торговый цикл (раздел 13.11.5) и тренд-гейт (13.11.7).
# trend.* — ML-прогноз удержания тренда (раздел 13.11.7).
ml:
  enabled: ${ML_ENABLED:false}
  dataset:
    timeframe: ${ML_DATASET_TIMEFRAME:MINUTE_10}
    lookback-bars: ${ML_DATASET_LOOKBACK_BARS:30}
    max-rows: ${ML_DATASET_MAX_ROWS:5000}
  model:
    path: ${ML_MODEL_PATH:ml/model.cbm}
  screening:
    top-n: ${ML_SCREENING_TOP_N:5}
  trend:
    horizon-bars: ${ML_TREND_HORIZON_BARS:6}
    top-n: ${ML_TREND_TOP_N:5}
  filter:
    enabled: ${ML_FILTER_ENABLED:false}
    threshold: ${ML_FILTER_THRESHOLD:0.5}
    trend-gate-enabled: ${ML_FILTER_TREND_GATE_ENABLED:false}
    trend-min-score: ${ML_FILTER_TREND_MIN_SCORE:0.5}

# Multi-timeframe фильтр входа (mtf.filter.*, roadmap v2.5): вход по 10-минутному
# ТФ гейтится трендом старшего ТФ (HOUR_1/DAY_1), ресемплированного из свечей
# младшего ТФ. По умолчанию выключен (pass-through).
mtf:
  filter:
    enabled: ${MTF_FILTER_ENABLED:false}
    higher-timeframe: ${MTF_FILTER_HIGHER_TIMEFRAME:HOUR_1}
    bars: ${MTF_FILTER_BARS:40}

resilience4j:
  circuitbreaker:
    instances:
      llm:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 20s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
      alor:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 4
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
          - org.springframework.web.reactive.function.client.WebClientResponseException$Unauthorized
          - org.springframework.web.reactive.function.client.WebClientResponseException$Forbidden
          - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException$UnprocessableEntity
  ratelimiter:
    instances:
      llm:
        limitForPeriod: 60
        limitRefreshPeriod: 60s
        timeoutDuration: 5s
      alor:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 3s
  retry:
    instances:
      llm:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        maxInterval: 5s
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
      alor:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        maxInterval: 8s
        randomizationFactor: 0.5
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
          - org.springframework.web.reactive.function.client.WebClientResponseException$Unauthorized
          - org.springframework.web.reactive.function.client.WebClientResponseException$Forbidden
          - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException$UnprocessableEntity

trading:
  mode: ${TRADING_MODE:SIMULATION}
  tickers:
    - Si
    - SBER
    - GAZP
    - LKOH
    - VTBR
    - ROSN
    - NVTK
    - PLZL
    - MGNT
    - TATN
    - CNYRUB_TOM
  bot-interval-ms: ${BOT_INTERVAL_MS:300000}
  strategy-interval-ms: ${STRATEGY_INTERVAL_MS:600000}
  monitor-interval-ms: ${MONITOR_INTERVAL_MS:10000}
  max-open-positions-for-new-entry: ${MAX_OPEN_POS:3}
  timeframe: MINUTE_10
  timeframes:
    - MINUTE_10
    - HOUR_1
    - DAY_1
  ws-quotes-enabled: ${WS_QUOTES_ENABLED:true}
  market-data-max-age-ms: ${MARKET_DATA_MAX_AGE_MS:15000}
  candle-stale-buffer-ms: ${CANDLE_STALE_BUFFER_MS:120000}
  obi-entry-threshold: ${OBI_ENTRY_THRESHOLD:0.5}

# Distributed lock (мульти-реплика): включить при запуске нескольких инстансов бота.
# В single-instance (по умолчанию) лок не используется, Redis не требуется.
distributed-lock:
  enabled: ${DISTRIBUTED_LOCK_ENABLED:false}
  scheduler-ttl-seconds: ${DISTRIBUTED_LOCK_SCHEDULER_TTL:60}
  position-open-ttl-seconds: ${DISTRIBUTED_LOCK_POSITION_OPEN_TTL:30}

# Backtest (bt.*): параметры прогона по умолчанию (раздел 11).
# Используются, когда REST-вызов не передаёт query-параметры.
bt:
  initial-capital: ${BT_INITIAL_CAPITAL:100000}
  days: ${BT_DAYS:365}
  timeframe: ${BT_TIMEFRAME:MINUTE_10}
  min-bars-for-signal: ${BT_MIN_BARS_FOR_SIGNAL:30}
  sl-percent: ${BT_SL_PERCENT:2.0}
  tp-percent: ${BT_TP_PERCENT:4.0}
  capital-slice: ${BT_CAPITAL_SLICE:0.20}
  # ML-фильтр входа в бэктесте (roadmap 13.11.6): признаки на момент бара,
  # signalStrength=null. Требует доступной модели; не влияет на live-гейт ml.filter.enabled.
  ml-filter-enabled: ${BT_ML_FILTER_ENABLED:false}
  # Multi-timeframe фильтр тренда в бэктесте (roadmap v2.5): вход гейтится трендом
  # старшего ТФ (mtf.filter.higher-timeframe) на момент бара; не влияет на live-гейт mtf.filter.enabled.
  mtf-filter-enabled: ${BT_MTF_FILTER_ENABLED:false}
  # Monte Carlo + стресс-сценарии бэктеста (roadmap 13.7.8): число bootstrap-симуляций
  # и фиксированный seed для воспроизводимых прогонов /api/v1/backtest/{ticker}/robustness.
  monte-carlo-simulations: ${BT_MONTE_CARLO_SIMULATIONS:1000}
  monte-carlo-seed: ${BT_MONTE_CARLO_SEED:42}
  # LLM-агенты в бэктесте (roadmap 13.8.1): по умолчанию выключены.
  # Включаются профилем `backtest` (application-backtest.yml) или переменной BT_AGENT_ENABLED=true.
  agent:
    enabled: ${BT_AGENT_ENABLED:false}
    sample-every: ${BT_AGENT_SAMPLE_EVERY:20}
    temperature: ${BT_AGENT_TEMPERATURE:0.0}
    cache-namespace: ${BT_AGENT_CACHE_NAMESPACE:backtest}

leverage:
  enabled: ${LEVERAGE_ENABLED:true}
  max-leverage: ${LEVERAGE_MAX:3.0}
  min-leverage: ${LEVERAGE_MIN:1.0}
  user-leverage: ${LEVERAGE_USER:2.0}

instruments:
  instruments:
    - ticker: "Si"
      type: "FUTURES"
      lotSize: 1
      priceStep: "0.01"
      priceStepCost: "10.0"
      go: "15000"
      leverage: "${leverage.user-leverage}"
      baseAsset: "USD"
    - ticker: "SBER"
      type: "STOCK"
      lotSize: 10
      priceStep: "0.01"
      priceStepCost: "0.1"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "GAZP"
      type: "STOCK"
      lotSize: 10
      priceStep: "0.05"
      priceStepCost: "0.5"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "LKOH"
      type: "STOCK"
      lotSize: 1
      priceStep: "1.0"
      priceStepCost: "1.0"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "VTBR"
      type: "STOCK"
      lotSize: 1000
      priceStep: "0.0001"
      priceStepCost: "0.1"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "ROSN"
      type: "STOCK"
      lotSize: 1
      priceStep: "0.05"
      priceStepCost: "0.05"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "NVTK"
      type: "STOCK"
      lotSize: 1
      priceStep: "1.0"
      priceStepCost: "1.0"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "PLZL"
      type: "STOCK"
      lotSize: 1
      priceStep: "1.0"
      priceStepCost: "1.0"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "MGNT"
      type: "STOCK"
      lotSize: 1
      priceStep: "1.0"
      priceStepCost: "1.0"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "TATN"
      type: "STOCK"
      lotSize: 1
      priceStep: "0.05"
      priceStepCost: "0.05"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "CNYRUB_TOM"
      type: "FX"
      lotSize: 1000
      priceStep: "0.0005"
      priceStepCost: "0.5"
      go: "0"
      leverage: "1.0"
      baseAsset: "CNY"
      quoteAsset: "RUB"
      alorTicker: "CNYRUB_TOM"
      slPercent: "0.5"
      tpPercent: "1.0"
      maxSpreadPercent: "2.0"
      maxGapPercent: "5.0"
      commissionRub: "10.0"

risk:
  enabled: true
  max-position-rub: 50000
  max-daily-loss-rub: 5000
  max-open-positions: 3
  futures-max-open-positions: 1
  max-sector-exposure: 2
  max-volatility-percent: 5.0
  default-stop-loss-percent: 2.0
  default-take-profit-percent: 4.0
  trailing-stop-enabled: true
  trailing-stop-percent: 1.0
  risk-per-trade-percent: 1.0
  kelly-fraction: 0.25
  kelly-wilson-z: 1.0
  kelly-min-trades: 15
  kelly-no-data-fraction: 0.25
  kelly-max-position-fraction: 0.10
  # Minimum Lot Override: разрешает 1 лот когда Kelly budget < notionalPerLot,
  # но Kelly > 0 и риск-кап позволяет. Отдельная политика, не обход Kelly.
  # Выключена по умолчанию. Включать только после backtest/forward-test.
  minimum-lot-policy-enabled: false
  # Минимальная доля Kelly/notional для override. 0.3 = Kelly должен рекомендовать
  # минимум 30% стоимости лота.
  minimum-lot-policy-min-kelly-fraction: "0.30"
  # Минимальный ожидаемый чистый прибыль на лот (RUB) для override.
  # Рассчитывается из статистики сделок (уже с учётом комиссии).
  minimum-lot-policy-min-net-profit-rub: "5"
  # Online-калибровка порога уверенности по исходам сделок (roadmap 13.11.8)
  confidence-calibration-enabled: true
  confidence-calibration-days: 14
  confidence-calibration-min-trades: 10
  confidence-calibration-target-win-rate: 0.55
  confidence-calibration-min-threshold: 0.50
  confidence-calibration-max-threshold: 0.85
  confidence-calibration-step: 0.05
  # Confidence-aware позиционный сайзинг (roadmap 13.11.9)
  confidence-sizing-enabled: true
  confidence-sizing-min-factor: 0.5
  confidence-sizing-max-factor: 1.0
  confidence-sizing-ceiling: 0.90
  # Целевая волатильность в %/день (дневной горизонт, DAY_1 свечи)
  volatility-target-percent: 4.0
  volatility-lookback-days: 20
  volatility-fallback-candles-per-day: 57
  min-volatility-size-multiplier: 0.25
  max-volatility-size-multiplier: 2.0
  max-gross-exposure-percent: 100.0
  max-net-exposure-percent: 100.0
  max-sector-correlation: 0.7
  kelly-drawdown-reduction: 0.5
  # Непрерывная деградация Kelly по глубине просадки (% от пика AUM -> множитель)
  drawdown-scale-tiers:
    "0.0": 1.0
    "3.0": 0.75
    "6.0": 0.5
    "10.0": 0.25
    "15.0": 0.0
  default-stop-loss-points: 50
  default-take-profit-points: 100
  # Вырожденные случаи (roadmap 13.3.5): широкий спред, гэп, депозитарная пауза
  degenerate-case-guard-enabled: true
  max-spread-percent: 1.0
  max-gap-percent: 3.0
  consecutive-zero-volume-bars: 3
  min-liquidation-distance-percent: 25.0
  max-margin-usage-percent: 30.0
  max-contracts-per-position: 1
  trading-hours-start: "10:00"
  trading-hours-end: "18:30"
  # Multi-Tier Drawdown Protection (% от AUM)
  max-daily-loss-percent: 2.0
  max-rolling-loss-7d-percent: 7.0
  max-rolling-loss-30d-percent: 12.0
  max-consecutive-losses: 3
  shadow-mode-enabled: true
  shadow-mode-cooldown-hours: 24
  # Volatility index filter (MOEX RVI)
  volatility-index-enabled: true
  volatility-index-ticker: "RVI"
  max-volatility-index-percent: 50.0
  # Volatility Engine 2.0 (Market Regime + Implied Volatility Si по опционам FORTS)
  market-regime-enabled: true
  regime-lookback-days: 60
  regime-min-history-samples: 20
  regime-percentile-low: 40.0
  regime-percentile-normal: 70.0
  regime-percentile-volatile: 90.0
  regime-volatile-size-multiplier: 0.5
  regime-min-open-position: 1000
  implied-volatility-enabled: true
  implied-volatility-ticker: "Si"
  implied-volatility-cache-ttl-minutes: 15
  # Portfolio Risk Engine (агрегированный портфельный риск: VaR95/effectiveN/концентрация)
  portfolio-risk-enabled: true
  portfolio-risk-blocked: true
  max-portfolio-var-percent: 5.0
  portfolio-var-warn-percent: 3.0
  min-effective-positions: 1.5
  portfolio-effective-warn-positions: 2.0
  max-directional-concentration-percent: 100.0
  portfolio-concentration-warn-percent: 100.0
  min-portfolio-scale-factor: 0.25
  portfolio-correlation-lookback-period: 50
  sectors:
    Si: FX
    SBER: FINANCE
    VTBR: FINANCE
    GAZP: ENERGY
    LKOH: ENERGY
    ROSN: ENERGY
    NVTK: ENERGY
    TATN: ENERGY
    PLZL: METALS
    MGNT: CONSUMER
    CNYRUB_TOM: FX

logging:
  level:
    # Прод по умолчанию — INFO: DEBUG даёт огромный объём логов и SQL-параметры.
    # Для локальной отладки используйте профиль dev: --spring.profiles.active=dev
    com.trading.bot: INFO
    org.springframework.jdbc: INFO

security:
  auth:
    user: ${AUTH_USER:}
    password: ${AUTH_PASSWORD:}
  analytics:
    user: ${ANALYTICS_USER:}
    password: ${ANALYTICS_PASSWORD:}
  metrics:
    scrape-token: ${METRICS_SCRAPE_TOKEN:}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    issuer: ${JWT_ISSUER:trading-bot}
    cookie-secure: ${JWT_COOKIE_SECURE:true}

lockbox:
  enabled: ${LOCKBOX_ENABLED:false}
  secret-id: ${LOCKBOX_SECRET_ID:}
  iam-token: ${LOCKBOX_IAM_TOKEN:}
  sa-key-json: ${LOCKBOX_SA_KEY_JSON:}
