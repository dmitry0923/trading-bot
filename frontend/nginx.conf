# P2-4: если TLS терминируется внешним прокси (Caddy), схема приходит в
# X-Forwarded-Proto. Для прямого доступа заголовка нет — берём $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: всё, кроме /api и /actuator, отдаётся index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API в бэкенд
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
