name: ML Training

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Модель (catboost | lightgbm)'
        required: false
        default: 'catboost'
      test_size:
        description: 'Доля OOS-выборки по времени (0.0-0.5)'
        required: false
        default: '0.2'
      dataset_url:
        description: 'Прямая ссылка на CSV (перекрывает выгрузку через API)'
        required: false
        default: ''
  schedule:
    # Еженедельно, понедельник 05:00 UTC.
    - cron: '0 5 * * 1'

# Шаг 2 ML-пайплайна (roadmap v2.4, раздел 13.11.3): скачивает датасет
# (экспорт GET /api/v1/ml/dataset через JWT-логин), обучает CatBoost/LightGBM
# с temporal OOS-сплитом и загружает артефакты (модель + отчёт) в CI.
jobs:
  train:
    name: Train model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Download dataset
        shell: bash
        env:
          ML_API_BASE: ${{ secrets.ML_API_BASE }}
          ML_API_USERNAME: ${{ secrets.ML_API_USERNAME }}
          ML_API_PASSWORD: ${{ secrets.ML_API_PASSWORD }}
        run: |
          if [ -n "${{ inputs.dataset_url }}" ]; then
            echo "Downloading dataset from provided URL"
            curl -fsSL "${{ inputs.dataset_url }}" -o dataset.csv
          else
            : "${ML_API_BASE:?set ML_API_BASE secret (base URL of the bot, e.g. https://bot.example.com)}"
            : "${ML_API_USERNAME:?set ML_API_USERNAME secret}"
            : "${ML_API_PASSWORD:?set ML_API_PASSWORD secret}"
            echo "Downloading dataset via bot API (JWT login)"
            TOKEN=$(curl -fsSL -X POST "$ML_API_BASE/api/v1/auth/login" \
              -H 'Content-Type: application/json' \
              -d "{\"username\":\"$ML_API_USERNAME\",\"password\":\"$ML_API_PASSWORD\"}" \
              | python -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
            curl -fsSL -H "Authorization: Bearer $TOKEN" \
              "$ML_API_BASE/api/v1/ml/dataset" -o dataset.csv
          fi

      - name: Train
        run: python ml/train.py --dataset dataset.csv --model "${{ inputs.model }}" --test-size "${{ inputs.test_size }}" --output-dir ml-artifacts

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-model
          path: ml-artifacts/
          retention-days: 30
