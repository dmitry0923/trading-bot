# LLM-агенты в бэктесте (roadmap 13.8.1).
# Запуск: --spring.profiles.active=backtest
#
# Включает конвейер живых агентов (tech → fund → strategy → contrarian → arbitrator)
# для генерации сигналов в прогоне. Детерминизм обеспечивается temperature=0.0,
# semantic cache изолирован namespace'ом bt.agent.cache-namespace (защита от
# look-ahead bias и загрязнения live-кэша), сэмплирование — каждые 20 баров.
spring:
  mvc:
    async:
      request-timeout: 600000

risk:
  default-stop-loss-percent: 2.0
  default-take-profit-percent: 15.0

bt:
  sl-percent: 2.0
  tp-percent: 15.0
  capital-slice: 0.50
  adaptive-confidence-threshold: 0.60
  agent:
    enabled: true
    # RESEARCH-настройки для сигнал-проверки (reinforce выращивания сигналов LLM):
    # - confidence-threshold 0.30 вместо live 0.60 — LLM-стратег/арбитр могут давать
    #   BUY/SELL при умеренной уверенности, иначе низкий signalStrength (0.3–0.35)
    #   тех-агента всегда превращается в HOLD.
    # - tech-min-signal-strength 0.0 — снимает жёсткий guardrail StrategyAgent
    #   (live: 0.5): в бэктесте вход в стратег-LLM при любом выводе кроме
    #   INSUFFICIENT_DATA. Live-путь НЕ затрагивается (там дефолт 0.5 в коде).
    # - prompt-version signal — версия промптов tech/strategy с расчётливой
    #   шкалой уверенности и входом по одному анализу (tech >= 0.20), чтобы
    #   LLM реально генерировал BUY/SELL вместо HOLD.
    confidence-threshold: 0.30
    tech-min-signal-strength: 0.0
    prompt-version: signal
