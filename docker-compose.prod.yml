version: "3.9"

# Прод-оверрайд для docker compose: вместо сборки на VM тянем готовые
# образы из Yandex Container Registry (образы собираются в CI, см.
# .github/workflows/deploy.yml).
#
# Использование на VM:
#   REGISTRY=cr.yandex/<id-реестра> TAG=<sha> \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    image: ${REGISTRY}/trading-bot-app:${TAG}
    build: !reset null
  frontend:
    image: ${REGISTRY}/trading-bot-frontend:${TAG}
    build: !reset null
