global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus-alerting-rules.yml"

scrape_configs:
  - job_name: "trading-bot"
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials: ${METRICS_SCRAPE_TOKEN}
    static_configs:
      - targets: ["app:8080"]
