apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mmvb-ingress
  namespace: mmvb-trading
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - your-domain.cloud.ru
      secretName: mmvb-tls
  rules:
    - host: your-domain.cloud.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mmvb-bot-service
                port:
                  number: 8080
