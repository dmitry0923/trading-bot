      leverage: "${leverage.user-leverage}"
      baseAsset: "USD"
    - ticker: "SBER"
      type: "STOCK"
      lotSize: 10
      priceStep: "0.01"
      priceStepCost: "0.1"
      go: "0"
      leverage: "1.0"
      baseAsset: "RUB"
    - ticker: "GAZP"
      type: "STOCK"
      lotSize: 10
