spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

trading:
  mode: SIMULATION
  tickers:
    - SBER
  bot-interval-ms: 60000
  strategy-interval-ms: 60000
  monitor-interval-ms: 60000
  max-open-positions-for-new-entry: 0
  backtest-years: 2

llm:
  api-key: test-key
  base-url: http://localhost:9999
  model: test-model

risk:
  enabled: true
  max-position-rub: 100000
  max-daily-loss-rub: 10000
  default-stop-loss-percent: 2.0
  default-take-profit-percent: 4.0
