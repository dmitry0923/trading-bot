global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: default
    # Рабочий webhook-sink из compose (возвращает 200 и пишет входящие в лог).
    # Для реальных уведомлений замените URL на Telegram/webhook-реле
    # (например, alertmanager-bot / prometheus-webhook-dingtalk).
    webhook_configs:
      - url: http://alert-sink:8080/alerts
        send_resolved: true
