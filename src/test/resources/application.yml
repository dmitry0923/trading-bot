app:
  scheduling:
    # Интеграционные тесты не запускают фоновые @Scheduled-задачи:
    # стратегический цикл, поллинг котировок и outbox-воркер не должны
    # ходить во внешние сервисы во время тестов.
    enabled: false
  outbox:
    rabbitmq:
      # По умолчанию RabbitMQ-транспорт выключен (брокер не требуется).
      # Интеграционный тест RabbitMqTransportIntegrationTest включает его
      # вручную через @DynamicPropertySource + RabbitMQContainer.
      enabled: false
      exchange: trading.outbox
      queue: trading.outbox.orders
      routing-key: order
      dlx: trading.outbox.dlx
      dlq: trading.outbox.orders.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

security:
  auth:
    user: test-admin
    password: test-admin-pass
  analytics:
    user: test-analytics
    password: test-analytics-pass
  metrics:
    scrape-token: test-metrics-scrape-token
  jwt:
    secret: test-jwt-secret-key-0123456789abcdef0123456789abcdef
    access-ttl-minutes: 15
    refresh-ttl-days: 30

# P0-аудит: портфельные лимиты Gross/Net оперируют РЫНОЧНОЙ экспозицией
# (market notional = цена × lotSize × qty), а НЕ маржой (ГО). Для тестовых
# фьючерсных симуляций (Si ~92k номинала при SIM-депо 50k) лимиты подняты,
# чтобы pipeline-механика (вход/SL/TP/ликвидация) проходила риск-гейты.
# LIVE-конфигурация (application.yml) остаётся 100% — фокус на CNYRUBF,
# чей номинал (12.8k–25.6k) укладывается в 100% AUM.
risk:
  max-gross-exposure-percent: 200.0
  max-net-exposure-percent: 200.0
