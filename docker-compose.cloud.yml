version: '3.8'

# Для запуска на Cloud.ru VPS / Dedicated Server
# Требования: Docker + Docker Compose установлены на сервере

services:
  bot:
    build: .
    container_name: mmvb-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database — используем Managed PostgreSQL от Cloud.ru или локальный
      - SPRING_DATASOURCE_URL=${DB_URL:jdbc:postgresql://postgres:5432/trading_bot}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:trader}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}

      # Redis — Managed Redis от Cloud.ru или локальный
      - SPRING_REDIS_HOST=${REDIS_HOST:redis}
      - SPRING_REDIS_PORT=${REDIS_PORT:6379}

      # API Keys
      - KIMI_API_KEY=${KIMI_API_KEY}
      - ALOR_TOKEN=${ALOR_TOKEN}
      - ALOR_REFRESH_TOKEN=${ALOR_REFRESH_TOKEN}
      - ALOR_PORTFOLIO=${ALOR_PORTFOLIO}

      # Trading settings
      - TRADING_MODE=${TRADING_MODE:SIMULATION}
      - BOT_INTERVAL_MS=${BOT_INTERVAL_MS:300000}
      - STRATEGY_INTERVAL_MS=${STRATEGY_INTERVAL_MS:600000}
      - MONITOR_INTERVAL_MS=${MONITOR_INTERVAL_MS:600000}
      - MAX_OPEN_POS=${MAX_OPEN_POS:0}
    depends_on:
      - postgres
      - redis
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Локальный PostgreSQL (если не используете Managed DB)
  postgres:
    image: postgres:16-alpine
    container_name: mmvb-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=trading_bot
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=${DB_PASS:trader_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trading-net
    profiles:
      - local-db  # Запускать только если нужен локальный PostgreSQL

  # Локальный Redis (если не используете Managed Redis)
  redis:
    image: redis:7-alpine
    container_name: mmvb-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    profiles:
      - local-redis  # Запускать только если нужен локальный Redis

  # Nginx reverse proxy + frontend
  nginx:
    build: ./frontend
    container_name: mmvb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/cloudru.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl  # SSL сертификаты Cloud.ru
    depends_on:
      - bot
    networks:
      - trading-net

volumes:
  pg_data:
  redis_data:

networks:
  trading-net:
    driver: bridge
