version: '3.8'

services:
  bot:
    build: .
    container_name: mmvb-bot
    ports:
      - "8080:8080"
    environment:
      - DB_USER=trader
      - DB_PASS=trader_secret
      - KIMI_API_KEY=${KIMI_API_KEY}
      - ALOR_TOKEN=${ALOR_TOKEN}
      - ALOR_REFRESH_TOKEN=${ALOR_REFRESH_TOKEN}
      - ALOR_PORTFOLIO=${ALOR_PORTFOLIO}
      - TRADING_MODE=SIMULATION
      - BOT_INTERVAL_MS=300000
      - STRATEGY_INTERVAL_MS=600000
      - MONITOR_INTERVAL_MS=600000
      - MAX_OPEN_POS=0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=trading_bot
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=trader_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
