global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus-alerting-rules.yml"

scrape_configs:
  - job_name: "trading-bot"
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      # Compose НЕ подставляет env-переменные в конфиг-файлы: токен монтируется файлом
      # `/etc/prometheus/token` (его пишет деплой из секрета METRICS_SCRAPE_TOKEN).
      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ["app:8080"]
