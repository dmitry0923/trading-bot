apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmvb-bot
  namespace: mmvb-trading
  labels:
    app: mmvb-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mmvb-bot
  template:
    metadata:
      labels:
        app: mmvb-bot
    spec:
      containers:
        - name: bot
          image: cr.cloud.ru/mmvb-trading-bot:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mmvb-config
            - secretRef:
                name: mmvb-secrets
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mmvb-bot-service
  namespace: mmvb-trading
spec:
  selector:
    app: mmvb-bot
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
