server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: mmvb-trading-bot-v2
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  task:
    scheduling:
      pool:
        size: 8
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading_bot}
    username: ${DB_USER:trader}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading_bot}
    username: ${DB_USER:trader}
    password: ${DB_PASS:}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5s

alor:
  api-url: ${ALOR_API_URL:https://api.alor.ru}
  ws-url: ${ALOR_WS_URL:wss://api.alor.ru/ws}
  token: ${ALOR_TOKEN:}
  refresh-token: ${ALOR_REFRESH_TOKEN:}
  portfolio: ${ALOR_PORTFOLIO:D12345}
  exchange: ${ALOR_EXCHANGE:MOEX}
  retry-enabled: ${ALOR_RETRY_ENABLED:true}
  rate-limiter-enabled: ${ALOR_RATE_LIMITER_ENABLED:true}
  max-order-retries: ${ALOR_MAX_ORDER_RETRIES:5}
  ws-reconcile-on-reconnect: ${ALOR_WS_RECONCILE_ON_RECONNECT:true}
  ws-heartbeat-interval-ms: ${ALOR_WS_HEARTBEAT_INTERVAL_MS:30000}
  ws-heartbeat-timeout-ms: ${ALOR_WS_HEARTBEAT_TIMEOUT_MS:45000}
  ws-stale-message-age-ms: ${ALOR_WS_STALE_MESSAGE_AGE_MS:5000}

moex:
  base-url: https://iss.moex.com/iss

macro:
  cbr-rate: ${CBR_RATE:16.0}
  brent-price: ${BRENT_PRICE:75.0}
  usd-rub: ${USD_RUB:90.0}
  usd-rub-ticker: USD000UTSTOM

llm:
  provider: ${LLM_PROVIDER:ROUTER_AI}
  api-key: ${LLM_API_KEY:}
  base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
  model: ${KIMI_MODEL:kimi-k3}
  router-ai-base-url: ${ROUTER_AI_BASE_URL:https://routerai.ru/api/v1}
  router-ai-model: ${ROUTER_AI_MODEL:auto}
  kimi-base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
  kimi-model: ${KIMI_MODEL:kimi-k3}
  deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  deepseek-model: ${DEEPSEEK_MODEL:deepseek-chat}
  qwen-base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  qwen-model: ${QWEN_MODEL:qwen-plus}
  timeout-sec: 30
  max-tokens: 4096
  temperature: 0.15
  semantic-cache-enabled: ${LLM_SEMANTIC_CACHE:true}
  semantic-cache-ttl-minutes: ${LLM_SEMANTIC_CACHE_TTL:30}
  guardrails-max-price-deviation-percent: 3.0
  circuit-breaker-enabled: true
  rate-limiter-enabled: true
  retry-enabled: true
  queue-capacity: 64
  queue-concurrency: 2

resilience4j:
  circuitbreaker:
    instances:
      llm:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 20s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
  ratelimiter:
    instances:
      llm:
        limitForPeriod: 60
        limitRefreshPeriod: 60s
        timeoutDuration: 5s
      alor:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 3s
  retry:
    instances:
      llm:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        maxInterval: 5s
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
      alor:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        maxInterval: 8s
        randomizationFactor: 0.5
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
          - org.springframework.web.reactive.function.client.WebClientResponseException$Unauthorized
          - org.springframework.web.reactive.function.client.WebClientResponseException$Forbidden
          - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException$UnprocessableEntity

trading:
  mode: ${TRADING_MODE:SIMULATION}
  tickers:
    - Si
    - SBER
    - GAZP
    - LKOH
    - VTBR
    - ROSN
    - NVTK
    - PLZL
    - MGNT
    - TATN
  bot-interval-ms: ${BOT_INTERVAL_MS:300000}
  strategy-interval-ms: ${STRATEGY_INTERVAL_MS:600000}
  monitor-interval-ms: ${MONITOR_INTERVAL_MS:10000}
  max-open-positions-for-new-entry: ${MAX_OPEN_POS:3}
  timeframe: MINUTE_10
  timeframes:
    - MINUTE_10
    - HOUR_1
    - DAY_1
  ws-quotes-enabled: ${WS_QUOTES_ENABLED:true}

leverage:
  enabled: ${LEVERAGE_ENABLED:true}
  default-leverage: ${LEVERAGE_DEFAULT:2.0}
  max-leverage: ${LEVERAGE_MAX:3.0}
  min-leverage: ${LEVERAGE_MIN:1.0}
  user-leverage: ${LEVERAGE_USER:2.0}

instruments:
