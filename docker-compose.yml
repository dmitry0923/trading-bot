version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: trading-bot-db
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: trading-bot-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trading_bot
      DB_USER: trader
      DB_PASS: trader
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALOR_API_URL: https://api.alor.ru
      ALOR_WS_URL: wss://api.alor.ru/ws
      ALOR_TOKEN: ${ALOR_TOKEN:-}
      ALOR_REFRESH_TOKEN: ${ALOR_REFRESH_TOKEN:-}
      ALOR_PORTFOLIO: ${ALOR_PORTFOLIO:-D12345}
      ALOR_EXCHANGE: ${ALOR_EXCHANGE:-MOEX}
      LLM_PROVIDER: ${LLM_PROVIDER:-ROUTER_AI}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ROUTER_AI_BASE_URL: ${ROUTER_AI_BASE_URL:-https://routerai.ru/api/v1}
      ROUTER_AI_MODEL: ${ROUTER_AI_MODEL:-auto}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k3}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      TRADING_MODE: ${TRADING_MODE:-SIMULATION}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-change-me-now}
      ANALYTICS_USER: ${ANALYTICS_USER:-analytics}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:-analytics-view-only}
      BOT_INTERVAL_MS: ${BOT_INTERVAL_MS:-300000}
      STRATEGY_INTERVAL_MS: ${STRATEGY_INTERVAL_MS:-600000}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-600000}
      MAX_OPEN_POS: ${MAX_OPEN_POS:-0}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: trading-bot-prometheus
    environment:
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-change-me-now}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:10.4.2
    container_name: trading-bot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_AUTH_USER: ${AUTH_USER:-admin}
        REACT_APP_AUTH_PASSWORD: ${AUTH_PASSWORD:-change-me-now}
    container_name: trading-bot-frontend
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
