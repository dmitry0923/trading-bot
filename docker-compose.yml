version: "3.9"

# ВАЖНО: пароли/токены сюда НЕ хардкодим. Значения без `?` и без дефолта
# приходят из .env (на проде — из Yandex Lockbox / GitHub Secrets на VM).
# Обязательные переменные задаются через `${VAR:?...}` — compose упадёт,
# если они не заданы (никаких дефолтных кредов).

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg15
    container_name: trading-bot-db
    environment:
      POSTGRES_DB: ${DB_NAME:-trading_bot}
      POSTGRES_USER: ${DB_USER:-trader}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trader} -d ${DB_NAME:-trading_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: trading-bot-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trading_bot}
      DB_USER: ${DB_USER:-trader}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALOR_API_URL: https://api.alor.ru
      ALOR_WS_URL: wss://api.alor.ru/ws
      ALOR_TOKEN: ${ALOR_TOKEN:-}
      ALOR_REFRESH_TOKEN: ${ALOR_REFRESH_TOKEN:-}
      ALOR_PORTFOLIO: ${ALOR_PORTFOLIO:-D12345}
      ALOR_EXCHANGE: ${ALOR_EXCHANGE:-MOEX}
      LLM_PROVIDER: ${LLM_PROVIDER:-ROUTER_AI}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ROUTER_AI_BASE_URL: ${ROUTER_AI_BASE_URL:-https://routerai.ru/api/v1}
      ROUTER_AI_MODEL: ${ROUTER_AI_MODEL:-auto}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k3}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      TRADING_MODE: ${TRADING_MODE:-SIMULATION}
      AUTH_USER: ${AUTH_USER:?AUTH_USER is required}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      ANALYTICS_USER: ${ANALYTICS_USER:-}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 bytes)}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      LOCKBOX_ENABLED: ${LOCKBOX_ENABLED:-false}
      LOCKBOX_SECRET_ID: ${LOCKBOX_SECRET_ID:-}
      LOCKBOX_IAM_TOKEN: ${LOCKBOX_IAM_TOKEN:-}
      LOCKBOX_SA_KEY_JSON: ${LOCKBOX_SA_KEY_JSON:-}
      BOT_INTERVAL_MS: ${BOT_INTERVAL_MS:-300000}
      STRATEGY_INTERVAL_MS: ${STRATEGY_INTERVAL_MS:-600000}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-600000}
      MAX_OPEN_POS: ${MAX_OPEN_POS:-0}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: trading-bot-prometheus
    environment:
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?METRICS_SCRAPE_TOKEN is required}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:10.4.2
    container_name: trading-bot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
    container_name: trading-bot-frontend
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
