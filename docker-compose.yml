version: "3.9"

# ВАЖНО: пароли/токены сюда НЕ хардкодим. Значения без `?` и без дефолта
# приходят из .env (на проде — из Yandex Lockbox / GitHub Secrets на VM).
# Обязательные переменные задаются через `${VAR:?...}` — compose упадёт,
# если они не заданы (никаких дефолтных кредов).

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg15
    container_name: trading-bot-db
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    restart: unless-stopped
    # Логи не должны заполнять диск VM (docker json-file растёт без лимита).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${DB_NAME:-trading_bot}
      POSTGRES_USER: ${DB_USER:-trader}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
      # МСК: SQL now() должен совпадать с бизнес-временем created_at/occurred_at.
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trader} -d ${DB_NAME:-trading_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: trading-bot-minio
    mem_limit: ${MINIO_MEM_LIMIT:-64m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command: server /data --console-address ":9001"
    # MinIO используется только для хранения LLM-трейсов (trace-storage.enabled).
    # Для локальной разработки дефолт minioadmin/minioadmin; на проде задайте
    # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD и включите TRACE_STORAGE_ENABLED.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # Опциональный RabbitMQ — только для outbox-транспорта (roadmap v2.3).
  # Запуск: docker compose --profile rabbitmq up -d rabbitmq
  # Тогда в .env задайте OUTBOX_RABBITMQ_ENABLED=true.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: trading-bot-rabbitmq
    mem_limit: ${RABBITMQ_MEM_LIMIT:-128m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # Build identity (P0-2): `GIT_COMMIT=<sha> docker compose build app`.
        # Пустое значение допустимо для SIM: BuildIdentity вернёт null, LIVE fail-closed.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: trading-bot-app
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    # Graceful shutdown: Spring ждёт до 30 с на слив HTTP (spring.lifecycle.timeout-per-shutdown-phase),
    # а Docker по умолчанию убивает контейнер через 10 с → @PreDestroy (финальный flush
    # микроструктуры/трейсов) не выполнялся (скан-12 P2).
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Managed PostgreSQL/Redis: переопределяются через env; дефолт — local compose.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-trading_bot}
      DB_USER: ${DB_USER:-trader}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      OUTBOX_RABBITMQ_ENABLED: ${OUTBOX_RABBITMQ_ENABLED:-false}
      ALOR_API_URL: https://api.alor.ru
      ALOR_WS_URL: wss://api.alor.ru/ws
      ALOR_TOKEN: ${ALOR_TOKEN:-}
      ALOR_REFRESH_TOKEN: ${ALOR_REFRESH_TOKEN:-}
      ALOR_PORTFOLIO: ${ALOR_PORTFOLIO:-D12345}
      ALOR_EXCHANGE: ${ALOR_EXCHANGE:-MOEX}
      LLM_PROVIDER: ${LLM_PROVIDER:-ROUTER_AI}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ROUTER_AI_BASE_URL: ${ROUTER_AI_BASE_URL:-https://routerai.ru/api/v1}
      ROUTER_AI_MODEL: ${ROUTER_AI_MODEL:-auto}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k3}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      TRADING_MODE: ${TRADING_MODE:-SIMULATION}
      # LIVE-guard должен приходить из деплоя, а не из yml-дефолтов: без этих переменных
      # контейнер брал watchlist из application.yml и allowlist не управлялся (скан-8 P1).
      # Дефолт = список из application.yml: пустая строка дала бы пустой watchlist.
      TRADING_TICKERS: ${TRADING_TICKERS:-Si,RI,CNYRUBF,SBER,GAZP,LKOH,VTBR,ROSN,NVTK,PLZL,MGNT,TATN,CNYRUB_TOM}
      LIVE_TICKERS_ALLOWLIST: ${LIVE_TICKERS_ALLOWLIST:-CNYRUBF}
      # WS-ордера — primary транспорт; без флага LIVE остаётся на REST (скан-8 P2).
      ALOR_WS_ORDERS_ENABLED: ${ALOR_WS_ORDERS_ENABLED:-false}
      # Бизнес-зона контейнера: без TZ JVM живёт в UTC и окна дат/таймстемпы уезжают.
      TZ: ${TZ:-Europe/Moscow}
      TRADING_FUNDING_VETO_ENABLED: ${TRADING_FUNDING_VETO_ENABLED:-false}
      TRADING_FUNDING_VETO_LONG_THRESHOLD_RUB: ${TRADING_FUNDING_VETO_LONG_THRESHOLD_RUB:-2.0}
      TRADING_FUNDING_VETO_SHORT_THRESHOLD_RUB: ${TRADING_FUNDING_VETO_SHORT_THRESHOLD_RUB:-2.0}
      TRADING_FUNDING_VETO_BLOCK_ON_UNKNOWN: ${TRADING_FUNDING_VETO_BLOCK_ON_UNKNOWN:-true}
      # Funding MOEX: дефолт FORTS-endpoint задан в FundingConfig; env
      # FUNDING_MOEX_URL / FUNDING_MOEX_HISTORY_URL перекрывают при необходимости.
      AUTH_USER: ${AUTH_USER:?AUTH_USER is required}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      ANALYTICS_USER: ${ANALYTICS_USER:-}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 bytes)}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      # Дефолт как в application.yml: http-деплой должен включать флаг осознанно.
      # Дефолт false: текущая топология — http за nginx без TLS, Secure-cookie не отправляется,
      # и refresh через 15 минут ломается (скан-9 P1). Включать вместе с TLS.
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      LOCKBOX_ENABLED: ${LOCKBOX_ENABLED:-false}
      LOCKBOX_SECRET_ID: ${LOCKBOX_SECRET_ID:-}
      LOCKBOX_IAM_TOKEN: ${LOCKBOX_IAM_TOKEN:-}
      LOCKBOX_SA_KEY_JSON: ${LOCKBOX_SA_KEY_JSON:-}
      BOT_INTERVAL_MS: ${BOT_INTERVAL_MS:-300000}
      STRATEGY_INTERVAL_MS: ${STRATEGY_INTERVAL_MS:-600000}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-10000}
      MAX_OPEN_POS: ${MAX_OPEN_POS:-3}
      TRACE_STORAGE_ENABLED: ${TRACE_STORAGE_ENABLED:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-llm-traces}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: trading-bot-prometheus
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-256m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?METRICS_SCRAPE_TOKEN is required}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Правила алертов и Bearer-токен: без первого файла Prometheus не стартует,
      # без второго скрейпы получают 401 (compose не подставляет env в конфиг) — скан-9 P1.
      - ./prometheus-alerting-rules.yml:/etc/prometheus/prometheus-alerting-rules.yml:ro
      - ./prometheus-token:/etc/prometheus/token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: trading-bot-alertmanager
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-64m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - alert-sink

  # Приёмник webhook для проверки доставки алертов. Для реальных уведомлений
  # замените URL в alertmanager.yml на Telegram/webhook-реле.
  alert-sink:
    image: hashicorp/http-echo:1.0
    container_name: trading-bot-alert-sink
    mem_limit: ${ALERT_SINK_MEM_LIMIT:-16m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    command: ["-listen=:8080", "-text=alert-received"]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: trading-bot-grafana
    mem_limit: ${GRAFANA_MEM_LIMIT:-192m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
    container_name: trading-bot-frontend
    mem_limit: ${FRONTEND_MEM_LIMIT:-32m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:

